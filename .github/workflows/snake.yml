name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F5C2E7&color_dots=#161b22,#3a2135,#6b3a5e,#b0708f,#E8A0C8&color_background=transparent
            dist/snake-light.svg?color_snake=#6b3a5e&color_dots=#ebedf0,#f9dcea,#F5C2E7,#E8A0C8,#b0708f&color_background=transparent

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
